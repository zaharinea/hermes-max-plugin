name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: lint (ruff format)
        run: uvx ruff format --check .
      - name: lint (ruff check)
        run: uvx ruff check .
      - name: compile
        run: python -m compileall -q .
      - name: tests
        # Gateway-dependent tests need a hermes-agent checkout; they are
        # ignored when HERMES_REPO is absent (see tests/conftest.py).
        run: uv run --with pytest --with pytest-asyncio --with httpx python -m pytest -q
